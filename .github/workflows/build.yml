name: Build apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'mini-shop-native.zip'
      - 'cloud-config.js'
      - 'developer-info.js'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          test -f mini-shop-native.zip || { echo "mini-shop-native.zip is missing from the repo root"; exit 1; }
          mkdir tmp
          unzip -q mini-shop-native.zip -d tmp
          f=$(find tmp -maxdepth 3 -name capacitor.config.json | head -n 1)
          if [ -z "$f" ]; then echo "capacitor.config.json not found inside the zip. Zip contents:"; find tmp -maxdepth 3 | head -n 50; exit 1; fi
          mkdir src
          cp -a "$(dirname "$f")"/. src/
          if [ -f cloud-config.js ]; then cp cloud-config.js src/docs/cloud-config.js; echo "Using cloud-config.js from the repo"; fi
          if [ -f developer-info.js ]; then cp developer-info.js src/docs/developer-info.js; echo "Using developer-info.js from the repo"; fi
          ls src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        working-directory: src
        run: |
          npm install
          npm install @capacitor-mlkit/barcode-scanning@^6 || echo "::warning::The native camera scanner plugin could not be installed. The app will use its built-in camera scanner instead."

      - name: Create Android project
        working-directory: src
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          if [ -d node_modules/@capacitor-mlkit/barcode-scanning ]; then
            sed -i 's#</application>#    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n    </application>#' "$M"
          fi
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          npx cap sync android

      
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS" || { echo "Keystore secret is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Keystore password is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Key alias is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Key password is missing"; exit 1; }

          mkdir -p "$RUNNER_TEMP/minishop-signing"
          printf '%s\n' "$KS" | sed '/BEGIN CERTIFICATE/d; /END CERTIFICATE/d' | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/minishop-signing/mini-shop-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/minishop-signing/mini-shop-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Personal keystore decoded and verified."

    
      - name: Configure personal APK signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: src/android
        run: |
          cat >> app/build.gradle <<'EOF'

          // Mini Shop personal signing configuration
          android {
            signingConfigs {
              debug {
                storeFile file(System.getenv("RUNNER_TEMP") + "/minishop-signing/mini-shop-release.jks")
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
          }
          EOF
          grep -A 8 "Mini Shop personal signing configuration" app/build.gradle



      - name: Build APK
        id: build
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: src/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug

      

      - name: Build again without the native scanner plugin (only runs if the first build failed)
        if: steps.build.outcome == 'failure'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: src
        run: |
          echo "::warning::The build with the native scanner plugin failed, so this APK uses the built-in camera scanner instead."
          npm uninstall @capacitor-mlkit/barcode-scanning || true
          npx cap sync android
          cd android
          ./gradlew clean assembleDebug

      

      - name: Name the file
        run: cp src/android/app/build/outputs/apk/debug/app-debug.apk MiniShop-Android.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Shop build ${{ github.run_number }}
          files: MiniShop-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        shell: pwsh
        run: |
          if (-not (Test-Path mini-shop-native.zip)) { throw "mini-shop-native.zip is missing from the repo root" }
          Expand-Archive -Path mini-shop-native.zip -DestinationPath tmp
          $f = Get-ChildItem -Path tmp -Recurse -Depth 3 -Filter capacitor.config.json | Select-Object -First 1
          if (-not $f) { throw "capacitor.config.json not found inside the zip" }
          New-Item -ItemType Directory -Path src | Out-Null
          Copy-Item -Path "$($f.DirectoryName)\*" -Destination src -Recurse -Force
          if (Test-Path cloud-config.js) { Copy-Item cloud-config.js src/docs/cloud-config.js -Force }
          if (Test-Path developer-info.js) { Copy-Item developer-info.js src/docs/developer-info.js -Force }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build installer
        shell: bash
        working-directory: src/desktop
        run: |
          cp -r ../docs www
          mkdir -p build
          cp ../docs/icon-512.png build/icon.png
          npm install
          npx electron-builder --win --publish never

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Shop build ${{ github.run_number }}
          files: src/desktop/dist/MiniShop-Windows-Setup.exe
