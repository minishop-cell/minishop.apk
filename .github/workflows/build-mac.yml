name: Build Mac app

# Run this by hand: Actions > Build Mac app > Run workflow.
# It is separate so a GitHub Mac-runner outage never blocks the Android and Windows builds.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          test -f mini-shop-native.zip || { echo "mini-shop-native.zip is missing from the repo root"; exit 1; }
          mkdir tmp
          unzip -q mini-shop-native.zip -d tmp
          f=$(find tmp -maxdepth 3 -name capacitor.config.json | head -n 1)
          if [ -z "$f" ]; then echo "capacitor.config.json not found inside the zip. Zip contents:"; find tmp -maxdepth 3 | head -n 50; exit 1; fi
          mkdir src
          cp -a "$(dirname "$f")"/. src/
          if [ -f cloud-config.js ]; then cp cloud-config.js src/docs/cloud-config.js; echo "Using cloud-config.js from the repo"; fi
          if [ -f developer-info.js ]; then cp developer-info.js src/docs/developer-info.js; echo "Using developer-info.js from the repo"; fi
          if [ -f license-config.js ]; then cp license-config.js src/docs/license-config.js; echo "Using license-config.js from the repo"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Mac app
        working-directory: src/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cp -r ../docs www
          mkdir -p build
          cp ../docs/icon-512.png build/icon.png
          npm install
          npx electron-builder --mac --x64 --arm64 --publish never

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-${{ github.run_number }}
          name: Mini Shop Mac build ${{ github.run_number }}
          files: src/desktop/dist/MiniShop-Mac-*.dmg
